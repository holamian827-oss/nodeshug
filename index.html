<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个 HTML5 游戏：贪吃蛇</title>
    <style>
        /* CSS：负责网页的皮肤和排版 */
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #00f2fe;
            margin-bottom: 10px;
        }
        #score-board {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        /* 游戏画布：黑色背景加一圈青色霓虹边框 */
        canvas {
            background-color: #1a1a1e;
            border: 4px solid #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            border-radius: 8px;
        }
        .tip {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>CYBER SNAKE</h1>
    <div id="score-board">得分: <span id="score">0</span></div>
    
    <!-- 游戏画面渲染在这个 Canvas 画布上 -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="tip">提示：使用键盘上的 <b>↑ ↓ ← →</b> 方向键来控制蛇的移动！</div>

    <script>
        // JavaScript：负责游戏的所有核心逻辑
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20; // 每一个格子的大小 (20x20 像素)
        const tileCount = canvas.width / gridSize; // 一行有多少个格子 (20个)

        // 1. 初始化蛇的位置（一开始由 3 个格子组成）
        let snake = [
            {x: 10, y: 10},
            {x: 9, y: 10},
            {x: 8, y: 10}
        ];

        // 2. 初始化食物的位置
        let food = {x: 5, y: 5};

        // 3. 蛇的移动速度（当前在 X 轴和 Y 轴上的移动方向）
        let dx = 1; // 默认往右走
        let dy = 0;

        let score = 0;
        let gameInterval;

        // 启动游戏的主循环（每 100 毫秒刷新一次画面，也就是 1 秒跑 10 格）
        function startGame() {
            gameInterval = setInterval(updateGame, 100);
        }

        // 核心函数：每次画面刷新时要做的事情
        function updateGame() {
            moveSnake();

            // 检查有没有撞墙或者撞到自己
            if (checkGameOver()) {
                clearInterval(gameInterval);
                alert("游戏结束！你的最终得分是: " + score);
                resetGame();
                return;
            }

            checkFoodCollision();
            drawGrid();
        }

        // 让蛇往前走一步
        function moveSnake() {
            // 根据当前方向，计算出蛇头的新坐标
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            // 把它塞进蛇身体数组的最前面（长出新头）
            snake.unshift(head);
            // 如果没吃到食物，就把蛇尾巴去掉一截（保持长度不变）
            // 如果吃到了食物，在 checkFoodCollision 里会处理，这里默认先去掉尾巴
            snake.pop();
        }

        // 检查蛇有没有吃到食物
        function checkFoodCollision() {
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                
                // 蛇吃到了食物，就不去掉尾巴（身体在 moveSnake 的基础上变长一格）
                // 重新在随机位置生成一个新的食物
                generateFood();
            }
        }

        // 随机在地图上生成食物
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            // 确保食物不会生成在蛇的身体上
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        // 检查游戏是否结束
        function checkGameOver() {
            const head = snake[0];
            
            // 撞墙检测
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            
            // 撞到自己身体检测
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        // 重新绘制游戏画面
        function drawGrid() {
            // 清空上一帧的画布
            ctx.fillStyle = "#1a1a1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画蛇：头部用青色，身体用蓝绿色
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#00f2fe" : "#4facfe";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#00f2fe";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // 画食物：发光的荧光红
            ctx.fillStyle = "#ff0844";
            ctx.shadowColor = "#ff0844";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            
            // 重置发光阴影，避免影响后续性能
            ctx.shadowBlur = 0;
        }

        // 重置游戏数据
        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            generateFood();
            startGame();
        }

        // 监听键盘按键，改变移动方向
        window.addEventListener("keydown", e => {
            switch(e.key) {
                case "ArrowUp":
                    if (dy !== 1) { dx = 0; dy = -1; } // 不能直接往相反方向走
                    break;
                case "ArrowDown":
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case "ArrowLeft":
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case "ArrowRight":
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        });

        // 启动游戏
        generateFood();
        startGame();
    </script>
</body>
</html>
