<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古诗意境</title>
    <style>
        /* 全局样式：全黑背景，消除边距，全屏居中显示 */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0e12;
            color: #ffffff;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* 科技感微弱渐变背景暗光 */
            background-image: radial-gradient(circle at 50% 50%, #1a1e29 0%, #0d0e12 80%);
        }

        /* 诗词容器：竖排文字排版，更有古典韵味 */
        .poetry-container {
            writing-mode: vertical-rl; /* 文字从右向左竖排 */
            text-orientation: mixed;
            letter-spacing: 0.5rem;   /* 字间距，营造呼吸感 */
            cursor: default;
        }

        /* 诗词正文：高亮发光效果 */
        .line {
            font-size: 2.2rem;
            font-weight: 300;
            line-height: 4.5rem;
            color: #e2e8f0;
            /* 青蓝色微弱霓虹发光，让文字在黑暗中更有质感 */
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            transition: all 0.5s ease;
        }

        /* 鼠标悬停时的动效：文字变亮、发光加深 */
        .line:hover {
            color: #00f2fe;
            text-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
            transform: scale(1.02);
        }

        /* 诗词作者小字 */
        .author {
            font-size: 1.1rem;
            color: #64748b;
            line-height: 4.5rem;
            margin-left: 1.5rem; /* 竖排时变成与正文的间距 */
            letter-spacing: 0.2rem;
        }
    </style>
</head>
<body>

    <div class="poetry-container">
        <!-- 诗词正文 -->
        <div class="line">受任于败军之际</div>
        <div class="line">奉命于危难之间</div>
        <!-- 作者/出处 -->
        <div class="author">—— 诸葛亮《出师表》</div>
    </div>

</body>
</html>
